name: sam3
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
  - numpy<2.0
  - pip:
      # sam3 실행에 직접 필요한 것들(네 리스트 기준)
      - sam3==0.1.0
      - opencv-python
      - pillow
      - matplotlib
      - scikit-image
      - scipy
      - scikit-learn
      - tqdm
      - pyyaml
      - requests
      - packaging
      - einops
      - timm
      - accelerate
      - huggingface-hub
      - safetensors
      - tokenizers
      - ftfy
      - regex
      - networkx
      - iopath
      - portalocker
      - pycocotools
      - imageio
      - lazy-loader
      - decord
      # PyTorch 2.7.0 + CUDA 12.6 전용 휠
      # 실제 설치 시 아래 명령으로 설치하는 것을 권장:
      # pip install torch==2.7.0 torchvision torchaudio \
      #   --index-url https://download.pytorch.org/whl/cu126

